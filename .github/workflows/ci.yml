name: CI
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: test_db, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt --break-system-packages
      - run: cd backend && python manage.py test
        env: {DB_HOST: localhost, CELERY_BROKER_URL: "redis://localhost:6379/0"}
      - run: pip install ruff --break-system-packages && ruff check backend/
      - run: pip install pip-audit --break-system-packages && pip-audit -r backend/requirements.txt
      - uses: trufflesecurity/trufflehog@main
        with: {path: ./}